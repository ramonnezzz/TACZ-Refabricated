plugins {
    // O client.jar/server.jar da 26.2 já vem sem ofuscação (Mojang não publica mappings pra essa
    // versão porque não há nada pra mapear). Por isso NÃO usamos o id '...-remap': ele força a
    // declarar uma dependência 'mappings' que não existe pra 26.2. O id puro liga automaticamente
    // o modo loom.disableObfuscation, que pula toda a pipeline de remapeamento — e, junto com
    // isso, as configurações mod* (modImplementation etc.) deixam de existir, então dependências
    // que antes eram "mod" viram implementation/compileOnly/runtimeOnly normais (ver abaixo).
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// KubeJS e ModernKeyBinding (committee.nova.mkb) estão comentados nas dependências (ver abaixo)
// porque ainda não têm build pra 26.2. O pacote compat/kubejs inteiro depende só dessas classes
// ausentes, então excluímos ele da compilação até a lib publicar uma versão compatível.
sourceSets {
    main {
        java {
            exclude 'com/tacz/guns/compat/kubejs/**'
            // Controllable também está comentado nas dependências (curse.maven:controllable), e
            // ControllableInner depende dele + do ModernKeyBinding, ambos ausentes na 26.2
            exclude 'com/tacz/guns/compat/controllable/ControllableInner.java'
            // player-animation-lib também está comentado; só o pacote animation/ depende dela
            // diretamente (PlayerAnimatorCompat vira um wrapper no-op, ver a classe)
            exclude 'com/tacz/guns/compat/playeranimator/animation/**'
            // simplebedrockmodel-fabric está travada em mc1.20.1 (ver gradle.properties) - o
            // renderer de arma em primeira/terceira pessoa inteiro é construído em cima dela,
            // então esses dois arquivos ficam sem substituto até a lib publicar build pra 26.2.
            // Os pontos de uso externos foram neutralizados (ver os respectivos arquivos).
            exclude 'com/tacz/guns/client/renderer/item/AnimateGeoItemRenderer.java'
            exclude 'com/tacz/guns/client/renderer/item/GunItemRendererWrapper.java'
            // Só usada pelo RenderHandEvent (cn.sh1rocu.simplebedrockmodel) e nunca mais
            // registrada em nenhum lugar (ver TaCZFabricClient) - inútil sem a lib
            exclude 'com/tacz/guns/client/event/FirstPersonRenderEvent.java'
            // BuiltinItemRendererRegistry (Fabric) sumiu de vez na 26.2 - o registro de
            // renderer 3D custom de item virou o sistema SpecialModelRenderer da vanilla, que
            // exige também mudanças nos JSONs de item model (não só Java). Fica pra uma
            // passada dedicada depois; por ora os 3 renderers de item ficam sem uso.
            exclude 'com/tacz/guns/client/renderer/item/AmmoItemRenderer.java'
            exclude 'com/tacz/guns/client/renderer/item/AttachmentItemRenderer.java'
            exclude 'com/tacz/guns/client/renderer/item/GunSmithTableItemRenderer.java'
            // AcceleratedRendering (AR) também sem build pra 26.2 (ver dependencies abaixo).
            // ARCompat.java virou um wrapper sempre-desligado (ARCompatImpl agora é stub sem as
            // classes reais da AR); esses arquivos ainda referenciam a API real da AR e ficam de
            // fora. O mixin config dela foi removido do fabric.mod.json também.
            exclude 'com/tacz/guns/compat/ar/AcceleratedBeamRenderer.java'
            exclude 'com/tacz/guns/compat/ar/BeamRenderContext.java'
            exclude 'com/tacz/guns/mixin/client/ar/BedrockPartMixin.java'
            // Carry On também está comentado nas dependências - removido também da lista de
            // mixins em tacz.fabric.mixins.json (senão o Mixin falha procurando a classe)
            exclude 'com/tacz/guns/compat/carryon/BlackList.java'
            exclude 'cn/sh1rocu/tacz/mixin/compat/carryon/ConfigLoaderMixin.java'
            // Explosion virou uma interface pura na 26.2 (a lógica real foi pra ServerExplosion,
            // um único método explode() opaco, sem a estrutura antiga de finalizeExplosion()
            // iterando bloco a bloco com profiler.pop() que esse mixin injetava em cima). Sem
            // decompilar o bytecode de ServerExplosion não dá pra achar um ponto de injeção
            // equivalente - IBlockExtension#tacz$onBlockExploded (ex: StatueBlockEntity soltando
            // o item ao explodir) fica sem funcionar por ora.
            exclude 'cn/sh1rocu/tacz/mixin/common/ExplosionMixin.java'
            // Type.RIDEABLE sumiu (virou boolean isRideable() direto) - o bloqueio de montaria
            // agora é feito só via TargetMinecart#isRideable(), ver o comentário lá. Esse mixin
            // genérico (interceptava a expressão "getMinecartType() == RIDEABLE" dentro do
            // tick() da vanilla) ficou obsoleto e foi removido de tacz.fabric.mixins.json.
            exclude 'cn/sh1rocu/tacz/mixin/common/AbstractMinecartMixin.java'
            // Mesma expressão quebrada (getMinecartType()==RIDEABLE) que AbstractMinecartMixin,
            // só que injetada num método de ArmorStand - provavelmente parte do mesmo mecanismo
            // de bloqueio de montaria em algum caminho de interação genérico da vanilla. Como
            // "required":true faz o mixin config inteiro falhar se qualquer um não aplicar,
            // desativa também em vez de arriscar quebrar o carregamento do mod inteiro.
            exclude 'cn/sh1rocu/tacz/mixin/common/ArmorStandMixin.java'
            // ShoulderSurfing também sem build pra 26.2 - ShoulderSurfingCompatInner virou stub
            // sem a API real dele (ver a classe); o Plugin (ServiceLoader) fica de fora
            exclude 'com/tacz/guns/compat/shouldersurfing/ShoulderSurfingPlugin.java'
            // Sem chamador nenhum sobrando (a máscara de stencil da lente de mira que isso
            // alimentava já tinha sido removida antes, ver BedrockAttachmentModel) - GL calls
            // internos (_texImage2D/_glFramebufferTexture2D) também mudaram de assinatura.
            // Morto de qualquer jeito, exclui em vez de portar bytecode-level GL hooks pra nada.
            exclude 'cn/sh1rocu/tacz/mixin/client/RenderTargetMixin.java'
        }
    }
}

base {
    archivesName = "${archives_base_name}-${minecraft_version}"
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/tacz.accesswidener")
    mixin {
        defaultRefmapName = "tacz.refmap.json"
    }
    runs {
        datagen {
            property "fabric-api.datagen.modid", "tacz"
        }
    }
}

repositories {
    maven {
        // 阿里云镜像，方便国内开发
        url = uri("https://maven.aliyun.com/repository/public/")
        content {
            includeGroup 'org.apache.commons'
        }
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        // Patchouli
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "Mod Maven"
        url = "https://modmaven.k-4u.nl"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven { url "https://maven.shedaniel.me/" } // cloth config api
    maven { url "https://dvs1.progwml6.com/files/maven/" }
    maven { url "https://modmaven.dev" }
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        // Shedaniel's maven (Architectury API)
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        // latvian.dev Maven (KubeJS and Rhino)
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
            includeGroup "com.github.FiguraMC.luaj"
        }
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {// CCA
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {// Forge Config API Port
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {// ModMenu
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = "devOSSnapshots"
        url = uri("https://mvn.devos.one/snapshots")
    }
    mavenCentral()
    mavenLocal()
    flatDir {
        dir 'libs'
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'com.google.code.findbugs:jsr305:3.0.2'

    // TRAVADO em mc1.20.1 (lib local em /libs) — comentado até termos build 26.2
    // modImplementation(include("libs:simplebedrockmodel-fabric:2.3.0.1+mc1.20.1"))

    implementation("com.maydaymemory:mae:1.1.1") {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }

    // Libs Java puras, sem dependência de versão do MC — devem seguir funcionando
    implementation(include('org.apache.commons:commons-math3:3.6.1'))
    implementation(include('com.github.FiguraMC.luaj:luaj-core:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('org.apache.bcel:bcel:6.6.1')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    // ===== A PARTIR DAQUI: tudo comentado até confirmarmos build 26.2 de cada um =====

    compileOnly("mezz.jei:jei-26.2-common-api:30.12.0.72")
    compileOnly("mezz.jei:jei-26.2-fabric-api:30.12.0.72")
    runtimeOnly("mezz.jei:jei-26.2-fabric:30.12.0.72")

    // modRuntimeOnly "curse.maven:spark-361579:4738953"
    // modRuntimeOnly "curse.maven:selene-499980:6902843"
    // modRuntimeOnly "curse.maven:mmmmmmmmmmmm-225738:6826546"
    // modCompileOnly "curse.maven:framework-549225:6531429"
    // modCompileOnly("curse.maven:controllable-317269:6171420")
    // modImplementation "curse.maven:shoulder-surfing-reloaded-243190:6784146"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // modCompileOnly "curse.maven:embeddium-908741:${embeddedt_id}"
    compileOnly "maven.modrinth:YL57xq9U:oaD6KQls" // Iris 1.11.2+26.2-fabric

    // modCompileOnly "curse.maven:carry-on-274259:${carry_on_id}"

    // modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${player_animation_lib}"

    // modCompileOnly "dev.latvian.mods:kubejs-fabric:${kubejs_version}"
    // modCompileOnly "dev.latvian.mods:rhino-fabric:${rhino_version}"
    // Só compileOnly: REI referencia dev.architectury.fluid.FluidStack na assinatura de
    // EntryStacks.of(...) (overload de fluido, que a gente não chama) - sem essa dependência no
    // classpath de compilação, javac falha resolvendo TODOS os overloads do método, mesmo os que
    // não usam FluidStack. Não precisamos dela em runtime.
    compileOnly "dev.architectury:architectury-fabric:21.0.2"

    // CCA — não tem sufixo de versão do MC no coordinate, mas mexe com registries/Mixins
    // internos que provavelmente quebraram entre 1.20.1 e 26.2. Comentado por segurança.
    // modImplementation(include("dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.3"))
    // modImplementation(include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.3"))

    // MKB — TRAVADO em "1.20.X" no nome do artifact
    // modImplementation(include("maven.modrinth:modernkeybinding:1.20.X-1.2.0"))

    // Sem ofuscação em 26.2 (ver comentário acima), não há infraestrutura mod* — usa implementation normal
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1"

    implementation("com.terraformersmc:modmenu:20.0.1")

    // modCompileOnly "maven.modrinth:zoomify:2.14.5+1.20.1"
    compileOnly "maven.modrinth:5ZwdcRci:Z3V4Ooz5" // ImmediatelyFast 1.16.2+26.2-fabric

    // modRuntimeOnly "maven.modrinth:tweakeroo:0.17.1"
    // modRuntimeOnly "maven.modrinth:malilib:0.16.3"

    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:26.2.820"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:26.2.820"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:26.2.820"

    // modImplementation "maven.modrinth:accrelatedrendering-refabricated:1.0.8-1.20.1-alpha-fabric.1"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-${project.minecraft_version}"
            from components.java
        }
    }

    repositories {
        maven {
            url "file:///D:/github_maven/Sh1roCu_MCRepo/repository"
        }
    }
}